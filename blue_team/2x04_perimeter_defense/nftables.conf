#!/usr/sbin/nft -f
# Generated by 4-nftables_config.sh from segmentation_rules.json - do not edit by hand.
flush ruleset

table inet meddefense {
    set dmz_net { type ipv4_addr; flags interval; elements = { 10.10.10.0/24 } }
    set internal_net { type ipv4_addr; flags interval; elements = { 10.10.0.0/22 } }
    set mgmt_net { type ipv4_addr; flags interval; elements = { 10.10.20.0/24 } }
    set meddev_net { type ipv4_addr; flags interval; elements = { 10.10.4.0/24 } }

    chain input {
        type filter hook input priority 0; policy drop;
        iif "lo" accept
        ct state established,related accept
        ct state invalid drop
        icmp type { echo-request, destination-unreachable, time-exceeded } accept
        icmpv6 type { echo-request, nd-neighbor-solicit, nd-neighbor-advert } accept
        iifname "enp0s3" tcp dport 22 accept comment "lab/OOB management access - not part of the MedDefense zone model"

        # Flows that terminate on this host (INTERNAL zone)
        ip saddr @mgmt_net tcp dport 22 accept comment "administration"
        ip saddr { 10.10.2.0/24 } tcp dport 443 accept comment "clinical workstations to internal EHR/web app tier"
        ip saddr { 10.10.2.0/24 } tcp dport 3306 accept comment "clinical workstations to internal database tier"
        ip saddr { 10.10.10.11 } tcp dport 3306 accept comment "DICOM imaging to PACS"
        ip saddr @meddev_net tcp dport 4242 accept comment "DICOM imaging to PACS"
        ip saddr @meddev_net tcp dport 443 accept comment "EHR web integration for device display"

        log prefix "meddefense-in-drop: " drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
        ct state established,related accept
        ct state invalid drop
        ip saddr @mgmt_net ip daddr @internal_net tcp dport 22 accept comment "administration"
        ip saddr @mgmt_net ip daddr @dmz_net tcp dport 22 accept comment "administration"
        ip saddr @mgmt_net ip daddr @meddev_net tcp dport 22 accept comment "administration of medical device hosts"
        ip saddr @mgmt_net ip daddr @meddev_net tcp dport 4242 accept comment "DICOM administration/config push"
        ip saddr { 10.10.10.11 } ip daddr @internal_net tcp dport 3306 accept comment "DICOM imaging to PACS"
        ip saddr @meddev_net ip daddr @internal_net tcp dport 4242 accept comment "DICOM imaging to PACS"
        ip saddr @meddev_net ip daddr @internal_net tcp dport 443 accept comment "EHR web integration for device display"
        ip saddr @dmz_net ip daddr @mgmt_net udp dport 53 accept comment "DNS resolution"
        ip saddr @dmz_net ip daddr @mgmt_net tcp dport 53 accept comment "DNS resolution (zone transfer / large replies)"
        ip saddr @internal_net ip daddr @mgmt_net udp dport 53 accept comment "DNS resolution"
        ip saddr @internal_net ip daddr @mgmt_net tcp dport 53 accept comment "DNS resolution (zone transfer / large replies)"
        ip saddr @meddev_net ip daddr @mgmt_net udp dport 53 accept comment "DNS resolution"
        ip saddr @meddev_net ip daddr @mgmt_net tcp dport 53 accept comment "DNS resolution (zone transfer / large replies)"

        log prefix "meddefense-fwd-drop: " drop
    }

    chain output {
        type filter hook output priority 0; policy accept;
        oif "lo" accept
        # This host (INTERNAL) must not originate traffic to zones it has no allow flow into.
        ip daddr @dmz_net log prefix "meddefense-out-drop: " drop
        ip daddr @meddev_net log prefix "meddefense-out-drop: " drop
    }
}
