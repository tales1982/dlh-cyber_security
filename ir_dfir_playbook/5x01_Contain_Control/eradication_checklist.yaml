  # ---------- Kerberos trust material ----------
  - id: ERAD-017
    category: krbtgt
    target_host: domain
    description: Double reset of krbtgt following confirmed Pass-the-Ticket with dmarsh tickets
    command_or_action: New-KrbtgtKeys.ps1 (Microsoft) - reset 1, confirm full AD replication (repadmin /syncall /AdeP, repadmin /showrepl), wait at least the max TGT lifetime (10 h), then reset 2
    rationale: Pass-the-Ticket was observed (TGS_REQ for cifs/WST-WS-017 from WST-WS-031 at 03:22:47Z, ticket reuse toward cifs/LIS-WSIDE-01 at 03:41:52Z). A password reset does not invalidate tickets already issued (TGT 02:44:02Z, 10 h). There is no evidence of DC compromise or DCSync, so the krbtgt hash itself is not known to be stolen; the double reset is still chosen because it is the only domain-wide way to invalidate every outstanding TGT obtained during the window. Two resets are needed because AD keeps the previous krbtgt key (n-1); the wait between resets avoids mass authentication failures. CISO approval required (domain-wide impact).
    verification_command: repadmin /showobjmeta <DC> "CN=krbtgt,CN=Users,DC=meddefense,DC=local" (pwdLastSet/version on every DC); DC 4769 events for dmarsh with tickets issued before reset 2
    expected_verification_result: krbtgt key version incremented by 2 on all DCs; no valid TGTs issued before the reset timestamp; no dmarsh TGS_REQ from unauthorized hosts
    status: pending
    executed_at: null
    executed_by: null

  # ---------- Network ----------
  - id: ERAD-018
    category: network
    target_host: perimeter
    description: Egress deny for both C2 IPs 185.220.101.47 (WST-WS-031) and 91.234.99.107 (WST-WS-017), plus Tor exit node list
    command_or_action: firewall policy update - keep IR-2026-0414-01-01 (185.220.101.47), add deny ip any host 91.234.99.107, subscribe to Tor exit node block list
    verification_command: curl -s http://127.0.0.1:8080/siem/netflow | jq '.data'
    expected_verification_result: both IPs in egress_deny_verified; packets = 0 and bytes = 0 toward both IPs over the last 24 hours
    status: pending
    executed_at: null
    executed_by: null

  - id: ERAD-019
    category: network
    target_host: internal (West Campus workstation VLANs)
    description: Internal segmentation - block workstation-to-workstation SMB/RPC/WinRM (445, 135, 5985/5986) and restrict ADMIN$ and LIS_REPORTS$ access to authorized admin/LIS groups
    command_or_action: internal firewall/VLAN ACL deny tcp 445,135,5985,5986 between workstation subnets; GPO Windows Firewall inbound deny 445 from workstation ranges; share ACL review on LIS_REPORTS$
    verification_command: Test-NetConnection WST-WS-017 -Port 445 from a workstation VLAN host; Get-SmbShareAccess LIS_REPORTS$
    expected_verification_result: TcpTestSucceeded False; LIS_REPORTS$ access limited to the LIS application group
    status: pending
    executed_at: null
    executed_by: null

