  # ---------- Account dmarsh ----------
  - id: ERAD-011
    category: credential
    target_host: domain
    description: Second reset of dmarsh AD password (after krbtgt reset 1 and ticket purge) and revoke Azure AD sessions and refresh tokens
    command_or_action: Set-ADAccountPassword -Identity dmarsh -Reset; Set-ADUser dmarsh -ChangePasswordAtLogon $true; Revoke-MgUserSignInSession -UserId dmarsh@meddefense.local
    verification_command: Get-ADUser dmarsh -Properties pwdLastSet; Azure AD sign-in logs for dmarsh after reset time
    expected_verification_result: pwdLastSet after reset time; no successful sign-in using prior tokens or from 45.63.9.88 after reset
    status: pending
    executed_at: null
    executed_by: null

  - id: ERAD-012
    category: credential
    target_host: azure_ad
    description: Remove attacker footholds from the cloud identity (PB-CRED-001) - MFA methods, inbox rules, forwarding, OAuth consents created after 2026-04-13T18:14:41Z from 45.63.9.88
    command_or_action: Get-MgUserAuthenticationMethod dmarsh (remove all, re-enrol by phone-verified identity); Get-InboxRule -Mailbox dmarsh (remove unexplained); Get-MgUserOauth2PermissionGrant (revoke unknown)
    verification_command: list MFA methods, inbox rules, forwarding and OAuth grants again
    expected_verification_result: only the newly enrolled MFA device; no rule, forwarding or grant the user cannot explain
    status: pending
    executed_at: null
    executed_by: null

  - id: ERAD-013
    category: credential
    target_host: WST-WS-031, WST-WS-017, LIS-WSIDE-01
    description: Purge cached Kerberos tickets for dmarsh on all three hosts (tickets reused in Pass-the-Ticket)
    command_or_action: klist -li 0x3a71c2 purge (WST-WS-031), klist -li 0x7a2d18 purge (WST-WS-017), klist -li 0x91f204 purge (LIS-WSIDE-01), or log off the sessions
    verification_command: klist -li <logon_id>; DC event 4769 for dmarsh with source host not equal to the user's assigned workstation
    expected_verification_result: 'klist shows "Cached Tickets: (0)"; no TGS_REQ for dmarsh from WST-WS-031/WST-WS-017 after purge'
    status: pending
    executed_at: null
    executed_by: null

