    category: process
    target_host: WST-WS-017
    description: Terminate powershell.exe (PID 4402, parent services.exe) and MSBuild.exe (PID 5108, C2 to 91.234.99.107)
    command_or_action: Stop-Process -Id 5108,4402 -Force (EDR live response, after memory capture of WST-WS-017)
    verification_command: Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'MSBuild' -or $_.CommandLine -match '-enc' }
    expected_verification_result: no process returned
    status: pending
    executed_at: null
    executed_by: null

  - id: ERAD-007
    category: malware_artifact
    target_host: WST-WS-017
    description: Remove dropped C:\Users\dmarsh\AppData\Local\Temp\update.xml (sha256 a4f1e9b4...c2d3) and the remote-exec service created via ADMIN$ around 03:23:02Z (powershell parent services.exe)
    command_or_action: Remove-Item C:\Users\dmarsh\AppData\Local\Temp\update.xml -Force; identify service from System event 7045 between 03:23:00Z and 03:23:44Z; sc.exe delete <service_name>
    verification_command: Test-Path C:\Users\dmarsh\AppData\Local\Temp\update.xml; Get-WinEvent -FilterHashtable @{LogName='System';Id=7045;StartTime='2026-04-14T03:20:00Z'}; sc.exe query <service_name>
    expected_verification_result: Test-Path False; sc query returns "The specified service does not exist"; persistence API temp_dropped_payloads update.xml = absent
    status: pending
    executed_at: null
    executed_by: null

  - id: ERAD-008
    category: malware_artifact
    target_host: WST-WS-017
    description: Sweep remaining persistence surfaces (scheduled tasks with GUID names, HKCU/HKLM Run, services, WMI subscriptions) and rebuild from clean baseline image
    command_or_action: schtasks /query /fo csv; reg query HKLM\Software\Microsoft\Windows\CurrentVersion\Run; Get-CimInstance -Namespace root\subscription -ClassName __EventFilter; then re-image from baseline
    verification_command: curl -s http://127.0.0.1:8080/endpoint/persistence/WST-WS-017 | jq '.data'
    expected_verification_result: scheduled_tasks_with_guid_names = [], both Run lists = [], amcache_entries_for_known_iocs = 0
    status: pending
    executed_at: null
    executed_by: null

  # ---------- LIS-WSIDE-01 (ePHI accessed) ----------
