# Eradication Checklist: IR-2026-0414-01
# Scope (after 03:34Z expansion): WST-WS-031, WST-WS-017, LIS-WSIDE-01, MEDDEFENSE\dmarsh,
# Kerberos ticket material (Pass-the-Ticket), C2 185.220.101.47 and 91.234.99.107.
# Rule: an item is "done" only when its verification returns the expected result.
# Precondition: all three hosts contained and evidence preserved (evidence_preservation.md).

incident_id: IR-2026-0414-01
owner: Tales Lima, on-call SOC
approver: Patricia Morales, CISO (SEV1 decision authority)

items:
  # ---------- WST-WS-031 (patient zero) ----------
  - id: ERAD-001
    category: process
    target_host: WST-WS-031
    description: Terminate attacker process chain update.exe (PID 7204) -> powershell.exe (PID 7812) -> MSBuild.exe (PID 8104), only after memory image is hashed
    command_or_action: Stop-Process -Id 8104,7812,7204 -Force (EDR live response)
    verification_command: Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'MSBuild|update' -or $_.CommandLine -match '-enc' }
    expected_verification_result: no process returned; EDR processtree shows 0 powershell->msbuild lineage
    status: pending
    executed_at: null
    executed_by: null

  - id: ERAD-002
    category: malware_artifact
    target_host: WST-WS-031
    description: Remove dropped payloads update.zip, update.xml (sha256 a4f1e9b4...c2d3) and update.exe (sha256 5a4b3c2d...5a4b)
    command_or_action: Remove-Item C:\Users\dmarsh\Downloads\update.zip, C:\Users\dmarsh\AppData\Local\Temp\update.xml, C:\Users\dmarsh\AppData\Local\Temp\update.exe -Force
    verification_command: Test-Path on the three paths + EDR live-response file search by sha256 on the whole disk
    expected_verification_result: Test-Path returns False for all three; no file matching either hash
    status: pending
    executed_at: null
    executed_by: null

  - id: ERAD-003
    category: malware_artifact
    target_host: WST-WS-031
    description: Remove scheduled task persistence {7B4F2D81-19E2-4A8C-9E67-A1F0DE2C7B3A} (trigger user_logon, action update.exe)
    command_or_action: schtasks /delete /tn "{7B4F2D81-19E2-4A8C-9E67-A1F0DE2C7B3A}" /f
    verification_command: schtasks /query /fo csv | findstr /i "7B4F2D81"
    expected_verification_result: no matches; persistence API scheduled_tasks_with_guid_names = []
    status: pending
    executed_at: null
    executed_by: null

  - id: ERAD-004
    category: malware_artifact
    target_host: WST-WS-031
    description: Remove Run key persistence HKCU\Software\Microsoft\Windows\CurrentVersion\Run\WindowsUpdateSvc in dmarsh hive
    command_or_action: reg delete "HKU\<dmarsh_SID>\Software\Microsoft\Windows\CurrentVersion\Run" /v WindowsUpdateSvc /f
    verification_command: reg query "HKU\<dmarsh_SID>\Software\Microsoft\Windows\CurrentVersion\Run" /v WindowsUpdateSvc
    expected_verification_result: 'reg query returns "unable to find the specified registry key or value"; HKCU and HKLM Run lists empty of IOC values'
    status: pending
    executed_at: null
    executed_by: null

  - id: ERAD-005
    category: malware_artifact
    target_host: WST-WS-031
    description: Rebuild from clean baseline image (in-memory payload + stolen tickets mean cleanup alone cannot be trusted)
    command_or_action: re-image via SCCM/MDT task sequence with baseline image, rejoin domain, keep in VLAN 999 until validation
    verification_command: curl -s http://127.0.0.1:8080/endpoint/processtree/WST-WS-031 | jq '.data.process_trees_matching.powershell_parent_msbuild_child'
    expected_verification_result: 0, and rebuild timestamp recorded in the processtree note
    status: pending
    executed_at: null
    executed_by: null

