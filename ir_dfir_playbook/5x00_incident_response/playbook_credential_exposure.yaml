playbook_id: PB-001
title: Credential Exposure via Phishing with Foreign Sign-In
owner_role: IR_Commander
applies_to:
  triggers:
    - Azure AD Identity Protection alert for sign-in from an unfamiliar foreign IP
    - Azure AD impossible travel alert on a MedDefense user account
    - User reports entering credentials on a fake Microsoft login page
    - Email gateway click alert on a known credential-harvesting URL
  indicators:
    - Successful sign-in from an IP or country never seen for this user
    - Phishing URL imitating login.microsoftonline.com in the user's mailbox
    - New MFA method registered or MFA prompt approved outside working hours
    - New inbox rule forwarding or deleting mail created after the sign-in
    - Unusual Epic or file share access volume from the account
severity_mapping:
  initial: SEV2
  escalate_if:
    - Compromised account is privileged (domain admin, Azure AD admin, or Epic admin) -> SEV1
    - ePHI confirmed accessed or exported during the exposure window -> SEV1
    - More than one MedDefense account confirmed compromised -> SEV1
    - Attacker activity reaches clinical systems at more than one site -> SEV1
immediate_actions:
  - step: Confirm the foreign sign-in in the Azure AD sign-in log (user, IP, time, application, result)
    owner: Technical_Lead
    timebox_minutes: 5
  - step: Declare SEV2, open the incident bridge, start the timeline
    owner: IR_Commander
    timebox_minutes: 5
  - step: Call the user by phone (not email) to confirm credential entry and the time it happened
    owner: Technical_Lead
    timebox_minutes: 5
  - step: Identify the account role and every system it can reach (Epic, file shares, VPN, mailbox)
    owner: Technical_Lead
    timebox_minutes: 10
  - step: Start evidence preservation before any reset
    owner: Technical_Lead
    timebox_minutes: 15
evidence_preservation:
  - artifact: Authentication logs (domain controllers, VPN, Epic login audit) for the user
    method: Export from SIEM for the window from phishing email delivery to now, store as read-only with SHA-256 hash
    before_step: Active Directory password reset
  - artifact: Azure AD sign-in log export for the user
    method: Export from Entra admin center (CSV and JSON) covering the last 30 days, hash and store in the evidence share
    before_step: Azure AD session revocation
  - artifact: Affected mailbox export including the phishing email and inbox rules
    method: Microsoft Purview content search and export to PST, plus Get-InboxRule output saved to file
    before_step: Azure AD session revocation
  - artifact: Recent data access audit export (Epic access audit, file share access, SharePoint and OneDrive audit)
    method: Epic access log report and Purview unified audit log export for the exposure window, hash and store
    before_step: Epic session termination
containment_actions:
  - step: Keep the attacker session open up to 15 minutes under monitoring, or reset immediately
    owner: IR_Commander
    decision_point: Reset immediately if the account is privileged, has Epic access to ePHI, or shows active data access; monitor for a maximum of 15 minutes only if evidence export is incomplete and no ePHI access is visible
    trade_off: Immediate reset stops further compromise but loses visibility of attacker actions and infrastructure; monitoring keeps visibility but accepts risk of further data access
  - step: Reset the Active Directory password and force change at next logon
    owner: Technical_Lead
    decision_point: Not applicable
    trade_off: Cuts attacker access to on-premises resources; the user is locked out until helpdesk issues a new password
  - step: Revoke all Azure AD refresh tokens and sessions (Revoke-MgUserSignInSession)
    owner: Technical_Lead
    decision_point: Not applicable
    trade_off: Ends attacker cloud sessions on Outlook, Teams, and SharePoint; the user is signed out on every device
  - step: Remove all registered MFA methods and re-register MFA with identity verification by phone
    owner: Technical_Lead
    decision_point: Not applicable
    trade_off: Removes any attacker-registered MFA device; the user cannot sign in until re-enrolment is completed
  - step: Revoke the user's VPN certificate and token, disconnect active VPN sessions
    owner: Technical_Lead
    decision_point: Not applicable
    trade_off: Blocks remote network access; the user loses remote work capability until a new token is issued
  - step: Terminate all active Epic sessions for the user and suspend Epic access until reset is complete
    owner: Technical_Lead
    decision_point: Coordinate with the clinical unit manager if the user is a clinician on active shift
    trade_off: Protects ePHI in Epic; the clinician must use a covering colleague or downtime procedure for active patients
  - step: Block the attacker IP and the phishing URL at the firewall, proxy, and email gateway
    owner: Technical_Lead
    decision_point: Not applicable
    trade_off: Stops reuse of the same infrastructure against other staff; no impact on clinical operations
eradication_actions:
  - Delete malicious inbox rules, forwarding settings, and OAuth app consents created by the attacker
  - Purge the phishing email from all MedDefense mailboxes with a Purview search and purge
  - Remove any MFA method, device, or app password registered from the attacker IP
  - Search all MedDefense sign-in logs for the same attacker IP and phishing URL, open new incidents for other hits
recovery_validation:
  - check: Azure AD sign-in log for the user for 72 hours after reset
    criterion: No sign-in from the attacker IP or any unfamiliar location
  - check: User sign-in test with new password and newly registered MFA
    criterion: User signs in successfully and MFA prompts come only from the re-enrolled device
  - check: Mailbox rules and forwarding review
    criterion: No inbox rules or forwarding that the user cannot explain
  - check: Epic access restored and audit reviewed
    criterion: User can open Epic and no new unexplained ePHI access appears in the audit
communication_plan:
  - audience: Affected user and line manager
    trigger: At reset, before the user is locked out
    template: comms_user_account_reset.md
  - audience: Legal_Liaison (General Counsel)
    trigger: As soon as the account is confirmed to have Epic or file share access to ePHI (HIPAA assessment trigger - was ePHI accessible from the compromised account during the exposure window?)
    template: comms_legal_hipaa_assessment.md
  - audience: Executive_Sponsor (CISO)
    trigger: On SEV2 declaration and at every escalation to SEV1
    template: comms_executive_update.md
  - audience: All staff
    trigger: When the same phishing campaign is found in other mailboxes
    template: comms_staff_phishing_alert.md
escalation_triggers:
  - Compromised account is privileged or has Epic admin rights
  - ePHI access or export confirmed in the data access audit during the exposure window
  - Attacker sign-in reappears after password reset and session revocation
  - Same attacker IP or phishing URL found on additional MedDefense accounts
  - No containment progress within 60 minutes of SEV2 declaration
post_incident_tasks:
  - Hand the HIPAA breach assessment result and evidence to the post-incident review
  - Review why the phishing email passed the email gateway and tune the filter
  - Add a detection rule for new MFA registration followed by a foreign sign-in
  - Evaluate phishing-resistant MFA (FIDO2) for Epic and admin accounts
  - Schedule targeted phishing awareness for the affected department
