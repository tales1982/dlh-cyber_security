roles:
  IR_Commander:
    primary: James Chen, SOC Lead
    backup: Robert Kim, Infrastructure Lead
    responsibilities:
      - Owns the incident through closure
      - Runs the incident bridge and timeline
      - Authorizes containment actions within authority ceiling
    authority_ceiling: SEV2
  Technical_Lead:
    primary: Robert Kim, Infrastructure Lead
    backup: Mike Torres, Network Engineer
    responsibilities:
      - Leads technical investigation and scoping
      - Executes containment, eradication, and recovery actions
      - Preserves forensic evidence before remediation
    authority_ceiling: SEV3
  Communications_Lead:
    primary: Marcus Webb, Communications Director
    backup: Sarah Park, IT Director
    responsibilities:
      - Drafts internal staff and executive updates
      - Owns media and patient-facing statements
      - Aligns all external messaging with Legal_Liaison
    authority_ceiling: SEV3
  Legal_Liaison:
    primary: Helena Reyes, General Counsel
    backup: Patricia Morales, Chief Information Security Officer
    responsibilities:
      - Runs the HIPAA breach notification assessment
      - Advises on regulatory and law enforcement notification
      - Approves external communications for legal exposure
    authority_ceiling: SEV2
  Executive_Sponsor:
    primary: Patricia Morales, Chief Information Security Officer
    backup: Sarah Park, IT Director
    responsibilities:
      - Approves business-impacting containment trade-offs
      - Briefs the CEO and board
      - Authorizes emergency resources and external IR support
    authority_ceiling: SEV1
  Scribe:
    primary: Mike Torres, Network Engineer
    backup: Sarah Park, IT Director
    responsibilities:
      - Keeps a timestamped log of actions and decisions
      - Tracks open tasks and owners on the bridge
      - Prepares the timeline for post-incident review
    authority_ceiling: SEV4

escalation:
  SEV1:
    on_detection:
      - IR_Commander
      - Technical_Lead
      - Executive_Sponsor
      - Scribe
    on_confirmation:
      - Communications_Lead
      - Legal_Liaison
    on_scope_expansion:
      - Executive_Sponsor
      - Legal_Liaison
      - Communications_Lead
    time_threshold_minutes_to_escalate: 30
  SEV2:
    on_detection:
      - IR_Commander
      - Technical_Lead
    on_confirmation:
      - Communications_Lead
      - Legal_Liaison
    on_scope_expansion:
      - Executive_Sponsor
    time_threshold_minutes_to_escalate: 60
  SEV3:
    on_detection:
      - Technical_Lead
    on_confirmation:
      - IR_Commander
      - Scribe
    on_scope_expansion:
      - Communications_Lead
      - Legal_Liaison
    time_threshold_minutes_to_escalate: 120
  SEV4:
    on_detection:
      - Technical_Lead
    on_confirmation:
      - IR_Commander
    on_scope_expansion:
      - Scribe
    time_threshold_minutes_to_escalate: 240
