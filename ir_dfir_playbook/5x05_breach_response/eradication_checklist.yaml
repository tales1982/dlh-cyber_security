    executed_at: 2026-04-21T20:05:00Z
    executed_by: Robert Kim
    verification_output: "PasswordLastSet 2026-04-21T20:05:04Z; msDS-KeyVersionNumber 6 on DC01 and DC02 (20:14Z); 3 stale-ticket failures from rebuilt hosts, cleared by klist purge"

