# Eradication Checklist: IR-2026-0420-01
# Scope: CS-WS-101, CS-WS-104, CS-WS-107, CS-WS-112, FILE-SVR-01 (named hosts) and
#        SCHED-SVR-01 (scope expansion, forensic_findings.md SYS-004); domain and perimeter items.
# Foothold being removed (forensic_findings.md): stager C:\ProgramData\Microsoft\svchost32.exe
#   (sha256 ff4c8a2d...9b1d) loading Cobalt Strike beacon.x64.dll (sha256 b08daa01...01c5) in memory;
#   service WinHealthSvc on all six hosts; Run value WinHealth on CS-WS-101; staged
#   C:\Windows\System32\encryption_staging.ps1 on four workstations; keylog drop klog.tmp;
#   credentials of jdoe, mdlocaladmin (shared local admin, no LAPS), svc_sched and 6 dwell-period users;
#   C2 staging.office365-cdn.net / 45.152.66.114.
# Rule: status "verified" only when verification_output shows the expected result.
#       "executed" = done but not yet verified; "pending" = not done.
# Precondition: disk images ART-012..ART-015 (CS-WS-104/107/112, SCHED-SVR-01) and FILE-SVR-01 C: image
#       hashed in hashes.txt before any destructive step (evidence_preservation.md).

incident_id: IR-2026-0420-01
owner: Tales Lima, on-call IR
approver: Patricia Morales, CISO (SEV1 decision authority)
executed_from: ir-jump01 (10.30.200.10) via WazuhEDR live response; hosts stay in EDR containment until recovery_validation.sh passes

