    expected_verification_result: PasswordLastSet 2026-04-21; key version incremented by 1; same version on every DC
    status: verified
    executed_at: 2026-04-21T09:40:00Z
    executed_by: Robert Kim
    verification_output: "PasswordLastSet 2026-04-21T09:40:11Z; msDS-KeyVersionNumber 4 -> 5 on DC01 and DC02 (09:52Z)"

  - id: ERAD-041
    category: kerberos
    target_host: DOMAIN (krbtgt)
    description: Second krbtgt reset after the maximum ticket lifetime (10 h) plus replication margin, so tickets signed with the previous key (still accepted after one reset) are also invalid
    command_or_action: New-KrbtgtKeys.ps1 -Mode reset, not earlier than 2026-04-21T19:40Z
    verification_command: same as ERAD-040; then DC event 4769 failure 0x1F / 4771 checks for stale tickets
