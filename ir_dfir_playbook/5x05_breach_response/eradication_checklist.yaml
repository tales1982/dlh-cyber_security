    verification_command: Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -match 'svchost32' -or ($_.Name -eq 'svchost.exe' -and $_.ExecutablePath -notmatch '^C:\\Windows\\System32') }; Test-Path C:\ProgramData\Microsoft\svchost32.exe; EDR file search sha256 ff4c8a2d9e7b1a3c5d8f2e6b4a1d9c7f3e0b8a6d2c9e1f5a7b3d8c4e6f2a9b1d
    expected_verification_result: no process returned; Test-Path False; 0 files with the stager hash
    status: verified
    executed_at: 2026-04-21T08:12:00Z
    executed_by: Tales Lima
    verification_output: "process query empty; Test-Path=False; EDR hash search 0 hits (08:13:40Z)"

